name: python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "contract/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "contract/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt"
