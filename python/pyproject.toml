[project]
name = "mmlabs-auth"
version = "0.1.0"
description = "Access-token verification (JWKS, ES256), role catalog cache and FastAPI require_permission() for mmlabs Identity."
requires-python = ">=3.12"
dependencies = [
    "PyJWT[crypto]>=2.10.1,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "respx>=0.23",
    "fastapi>=0.110",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmlabs_auth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
